name: Windows Runner

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Verificar ambiente
        shell: pwsh
        run: |
          Write-Host "=== Windows Runner ==="
          Write-Host "Usuário:"
          whoami

          Write-Host "`n=== Windows ==="
          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion, OsArchitecture

      - name: Verificar rede
        shell: pwsh
        run: |
          Write-Host "=== IPs ==="
          Get-NetIPAddress -AddressFamily IPv4 |
            Where-Object {
              $_.IPAddress -notlike "127.*" -and
              $_.IPAddress -notlike "169.254.*"
            } |
            Select-Object InterfaceAlias, IPAddress

      - name: Verificar ferramentas
        shell: pwsh
        run: |
          Write-Host "=== PowerShell ==="
          $PSVersionTable

          Write-Host "`n=== Git ==="
          git --version

      - name: Executar tarefa
        shell: pwsh
        run: |
          Write-Host "Runner Windows funcionando corretamente."
          Write-Host "Hora: $(Get-Date)"

      - name: Finalizar
        shell: pwsh
        run: |
          Write-Host "Workflow concluído."
